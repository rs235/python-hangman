name: Python Code Validation

on:
  pull_request:
    paths-ignore:
      - README.md

  workflow_dispatch:

jobs:

  python-lint:
  
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Create Python virtual environment and add it to PATH
        run: |
          python -m venv "${{ runner.temp }}/venv"
          echo "${{ runner.temp }}/venv/bin" >> "$GITHUB_PATH"

      - name: Install pip
        run: python -m pip install pip==26.2.1

      - name: Install ruff
        run: |
          python -m pip install ruff==0.17.3

      - name: Run ruff
        run: |
          ruff check .
